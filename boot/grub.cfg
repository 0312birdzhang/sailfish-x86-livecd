set default=0
set timeout=5
set gfxmode=auto
insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "Sailfish OS Live (persistent)" {
    linux /casper/vmlinuz boot=casper persistent username=live hostname=sailfish-live systemd.unified_cgroup_hierarchy=0 console=tty0 console=ttyS0,115200n8
    initrd /casper/initrd
}

menuentry "Sailfish OS Live (persistent, basic graphics)" {
    linux /casper/vmlinuz boot=casper persistent username=live hostname=sailfish-live nomodeset systemd.unified_cgroup_hierarchy=0 console=tty0 console=ttyS0,115200n8
    initrd /casper/initrd
}

menuentry "Sailfish OS Live (temporary)" {
    linux /casper/vmlinuz boot=casper nopersistent username=live hostname=sailfish-live systemd.unified_cgroup_hierarchy=0 console=tty0 console=ttyS0,115200n8
    initrd /casper/initrd
}

menuentry "Sailfish OS Live (temporary, basic graphics)" {
    linux /casper/vmlinuz boot=casper nopersistent username=live hostname=sailfish-live nomodeset systemd.unified_cgroup_hierarchy=0 console=tty0 console=ttyS0,115200n8
    initrd /casper/initrd
}
